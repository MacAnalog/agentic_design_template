# The one file that describes this design to the harness (spicexplorer-harness).
# Keys not listed here keep their defaults; unknown keys fail `make lint`.
name: <design>
package: design         # this design's own Python package, named for the DESIGN and renamed at
                        # instantiation (`git mv design <name>`); instances use `ldo/`, `mzm_tx/`.
                        # `make lint`'s `package-importable` locates it — nothing is imported.
exp_env: EXP            # env var stamping every ledger row with the experiment id
jobs_env: JOBS          # width of spicexplorer_harness.batch
# sim_env: SIM_NGSPICE  # the native ngspice binary design/sim.py runs (default: exp_env's prefix + _NGSPICE)
                        # on `lane: bridge` it names a LAUNCHER carrying the tool environment instead,
                        # so set it explicitly there — the default spells `_NGSPICE`, which that lane is not
# work_env: SIM_WORK    # the work root (default: prefix + _WORK; else $SX_SCRATCH/<design>-<checkout>)

# WHICH simulator lane `design/sim.py` re-exports. Leave it OUT for the open lane: absent means
# `ngspice` — `design/sim_ngspice.py`, native ngspice on this machine — and nothing about an
# open-PDK design changes. `bridge` selects `design/sim_bridge.py`: a commercial kit whose models
# load only in the vendor simulator on the lab's EDA server, wrapped over the platform's
# bridge-lane package (add it to pyproject.toml, fill in design/pdk.py, and drop this file's
# `denylist:` entry for the simulator's own name).
# NEEDS a platform whose `spicexplorer_harness.config.Harness` carries `lane:`; an older one
# refuses the key outright (`harness.yaml: unknown keys ['lane']`) rather than ignoring it.
# lane: bridge          # ngspice (default, key absent) | bridge

# The process this design is drawn in, as its own preflight reports it (`ihp-sg13g2`). Free-form.
# `design/pdk.py` derives the per-MACHINE model-library variable from it — `<PDK-ID>_PDK_LIB`,
# uppercased with `-` as `_` — so one export per account serves every design in that process.
# pdk: <pdk-id>

# The headline of the challenge, as the context pack states it at the top of every task.
goal: "<the metric to beat, its bound, and what may not be given back>"

# The acceptance box. ops: < <= > >= in abs<=. Every bound must also appear in doc/target-spec.md.
# Keys are UNIT-SCALED: `make lint` matches each bound as the literal `f"{bound:g}"` in the prose,
# so a bound in base SI (1e-4 A) would have to read `0.0001` there — carry `_ua`/`_mv`/`_khz` keys
# and scale in `design.metrics.KEYMAP` instead. Optional v2 fields (`id`, `tolerance`,
# `verification_method`, `allocated_from`, `source`, `certify`) are shown on S1.
spec:
  - {key: gain_db, label: gain, op: ">=", bound: 60, unit: dB,
     id: S1, verification_method: simulation, tolerance: {kind: abs, delta: 0.5}, certify: true,
     source: {note: "<references/INDEX.md handle, standard, or the system row this was allocated from>"}}
  - {key: pm_deg, label: PM, op: ">=", bound: 60, unit: deg, id: S2}
  - {key: power_uw, label: power, op: "<=", bound: 100, unit: uW, id: S3}
# Extra spec-frame lines for the pack: report-only columns, expensive sign-off definitions, gates.
# Both instantiations needed all three shapes, so keep the habit:
#   - "report-only: <keys measured on every evaluate but never pass/fail>"
#   - "<Sn> is also checked at <the off-nominal points the fast scorecard does not run>"
#   - "<what the reference is NOT: the conditions it was certified at, if they are not the target's>"
spec_notes: []

# Reference material: papers, datasheets, standards. Cited by the handle in its index, never by
# filename, so a renamed file never orphans a citation.
papers_dir: references
papers_index: references/INDEX.md

# The experiments index. `Phase` names which of the five design phases the experiment belongs to
# (system | topology | sizing | improve | layout) — see CLAUDE.md, "How the work is organized".
experiments_rows: [Phase, Paper, Hypothesis, Verdict]

# Certified artefacts, sha-locked with SHA256SUMS (`make freeze` after certification). Both point
# into `signoff/` — the design of record, one directory per simulation fidelity (`signoff/README.md`).
frozen: []                       # e.g. [signoff/prelayout/decks]
reference_scorecard: ""          # e.g. signoff/prelayout/decks/scorecard.json ({"scorecard": {...}})

# Who may sign a ledger row (`evidence: signed`). Uncomment with real ids: without a roster the
# alias heuristic stands in, and a name that folds onto the author's is refused as a self-sign.
# verifiers: [owner, signoff-verifier]

# Memory surfaces: entries stay under size_cap (20 KB); the one-line-per-entry index may grow past it.
memory: {index_size_cap: 32000}

gitignore_must: ["runs/", "*.raw", "__pycache__/", "experiments/*/out/", ".sx/platform"]

# Provenance scrub: [{pattern, why, flags}] regexes that may not appear anywhere in the tree
# (flags: "" = case-sensitive; default is case-insensitive). `harness.yaml` and `lint.py` are
# exempt, so the patterns may be spelled here. Both instantiations converged on this list; add
# the foundry names this design is NOT built in.
denylist:
  - {pattern: "\\bcadence\\b", why: EDA vendor name}
  - {pattern: "\\bspectre\\b", why: commercial simulator name}
  - {pattern: "\\bvirtuoso\\b", why: commercial schematic editor name}
  - {pattern: "\\bmaestro\\b", why: commercial ADE tool name}

# `make runs` columns ({key, w: width, p: decimals}; strings left-justified). One list, or a
# {kind: [...]} map when other row kinds carry different fields — `design.metrics` logs `evaluate`
# rows plus one `bench` row per deck, so a repo with multiple benches wants the map:
#   ledger_columns:
#     evaluate: [{key: gain_db, w: 8, p: 1}, ...]
#     bench:    [{key: bench, w: 18}, {key: status, w: 8}]
ledger_columns:
  evaluate:
    - {key: gain_db, w: 8, p: 1}
    - {key: pm_deg, w: 7, p: 1}
    - {key: power_uw, w: 9, p: 2}
  bench:
    - {key: bench, w: 18}
    - {key: status, w: 8}
